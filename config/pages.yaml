version: 1

# The site information architecture, adopted from jvto-new-on-design-system:
# 8 FILE groups in order, hub -> child, per-page block composition. Sections
# reference content atoms by ref_query (resolved from projection.json) or explicit
# entity_refs (canonical_keys). Tour + destination DETAIL pages are generated from
# entities by scripts/build-pages.mjs (see `generate:`). visual_mode/cluster follow
# the bootstrap visual-modes: Home->homepage; Tours/Destinations->travel;
# Verify/Policy->trust; Why-JVTO/Travel-Guide/Contact/Blog->hybrid.

groups:
  "001": { label: Home,            cluster: homepage }
  "002": { label: Tours,           cluster: travel }
  "003": { label: Destinations,    cluster: travel }
  "004": { label: Why JVTO,        cluster: hybrid }
  "005": { label: Travel Guide,    cluster: hybrid }
  "006": { label: Verify & Policy, cluster: trust }
  "007": { label: Contact,         cluster: hybrid }
  "008": { label: Blog,            cluster: hybrid }
  "009": { label: Team,            cluster: trust }

# Section vocabulary (section_type): hero, section_head, rich_text, callout,
# steps, vantage, dest_facts, data_box, timeline, faq_list, card_grid, cta.
# ref_query vocabulary (resolved by build-pages): packages:all|origin=surabaya|
# origin=bali ; destinations:real ; faq:all ; crew:all ; people:founders.

pages:
  # ── FILE 001 — Home ─────────────────────────────────────────────────────────
  - route: /
    file_group: "001"
    page_type: homepage
    template: index
    visual_mode: homepage
    title: "Tourist Police-Led Private Volcano Tours in East Java | Java Volcano Tour Operator"
    h1: "Tourist Police-Led Private Volcano Tours in East Java"
    sections:
      - { type: hero }
      - { type: section_head, content: { title: "Why JVTO" } }
      - { type: card_grid, variant: package, ref_query: "packages:all" }
      - { type: card_grid, variant: landscape, ref_query: "destinations:real" }
      - { type: faq_list, ref_query: "faq:all" }
      - { type: cta }

  # ── FILE 002 — Tours ────────────────────────────────────────────────────────
  - route: /tours
    file_group: "002"
    page_type: hub
    template: collection
    visual_mode: travel
    title: "All JVTO Tours — Private Bromo, Ijen & Tumpak Sewu"
    sections:
      - { type: section_head, content: { title: "All Tours" } }
      - { type: card_grid, variant: tour, ref_query: "packages:all" }
      - { type: cta }
  - route: /tours/from-surabaya
    file_group: "002"
    hub_route: /tours
    page_type: hub
    template: collection
    visual_mode: travel
    title: "Tours from Surabaya"
    sections:
      - { type: section_head, content: { title: "From Surabaya" } }
      - { type: card_grid, variant: tour, ref_query: "packages:origin=surabaya" }
  - route: /tours/from-bali
    file_group: "002"
    hub_route: /tours
    page_type: hub
    template: collection
    visual_mode: travel
    title: "Tours from Bali"
    sections:
      - { type: section_head, content: { title: "From Bali" } }
      - { type: card_grid, variant: tour, ref_query: "packages:origin=bali" }

  # ── FILE 003 — Destinations ─────────────────────────────────────────────────
  - route: /destinations
    file_group: "003"
    page_type: hub
    template: collection
    visual_mode: travel
    title: "Destinations — Bromo, Ijen, Tumpak Sewu, Madakaripura, Papuma"
    sections:
      - { type: section_head, content: { title: "Destinations" } }
      - { type: card_grid, variant: landscape, ref_query: "destinations:real" }

  # ── FILE 004 — Why JVTO ─────────────────────────────────────────────────────
