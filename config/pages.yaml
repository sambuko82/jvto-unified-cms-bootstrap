# Generated DETAIL pages (build-pages.mjs expands these from entities).
generate:
  tours:
    from: package                       # one page per package entity
    file_group: "002"
    page_type: tour
    template: tour
    visual_mode: travel
    route: "/tours/from-{origin}/{slug}" # origin+slug parsed from canonical_key
    hub_by_origin: { surabaya: /tours/from-surabaya, bali: /tours/from-bali }
    sections:                            # entity_refs auto: the package + its destinations + booking policy
      - { type: hero,       self: true }
      - { type: steps,      self: true, refs_from: itinerary_route }
      - { type: vantage,    refs: ["general_module:inclusion-all-inclusive-baseline", "general_module:exclusion-standard"] }
      - { type: section_head, content: { title: "Destinations on this route" } }
      - { type: card_grid,  variant: landscape, refs_from: destination_tokens }
      - { type: data_box,   refs: ["policy_document:payment-rules", "policy_document:cancellation-package-credit"] }
      - { type: faq_list,   ref_query: "faq:all" }
      - { type: cta,        self: true }
  destinations:
    from: destination
    file_group: "003"
    page_type: destination
    template: destination
    visual_mode: travel
    route: "/destinations/{token}"
    only: [mount-bromo, kawah-ijen, tumpak-sewu, madakaripura, papuma-beach]
    # Routes are owned by the design-system IA (the SSOT) — NOT by the current live
    # jvto-web, which will be updated to follow the SSOT. Live copy is still pulled in
    # by identity (see build-pages.mjs DEST_ROUTE_ALIAS), regardless of the live URL slug.
    token_map: { mount-bromo: bromo, kawah-ijen: ijen, tumpak-sewu: tumpak-sewu, madakaripura: madakaripura, papuma-beach: papuma }
    sections:
      - { type: dest_facts, self: true }
      - { type: rich_text,  self: true }
      - { type: callout,    variant: lime, when_ijen: true, refs: ["general_module:policy-ijen-health-screening"] }
      - { type: section_head, content: { title: "Packages that include it" } }
      - { type: card_grid,  variant: package, refs_from: packages_with_destination }
  team:
    from: public_person_profile           # one page per operational crew member
    file_group: "009"
    page_type: crew_profile
    template: crew_profile
    visual_mode: hybrid
    route: "/team/{slug}"                  # matches the jvto-db /team/{slug} rows + the Person-schema @id URLs
    hub_route: /why-jvto/our-team          # the crew card_grid on our-team is the hub; these are its detail pages
    # The 11 crew that carry a rich jvto-db /team/{slug} profile row. Their structured fields
    # (role / KTA / languages / strengths / review rating / portrait) hydrate from the
    # public_person_profile entity via `self`; the name (→ h1), bio, review evidence, and
    # knowsAbout page copy is overlaid by route match in build-pages — no new overlay code.
    # (dika/pras/yusuf have no per-person source row yet, so they get no page — added when a
    # source row exists; the our-team grid still lists all 14.)
    only: [anjas, boy, fauzi, fredi, gufron, holili, joyo, kiki, rendi, taufik, yandi]
    sections:
      - { type: profile, self: true }      # hydrates public_person_profile:{slug}; page_content auto-overlaid

redirects:
  - { from: /about, to: /why-jvto/our-story }
  - { from: /faq, to: /travel-guide/faq }
  - { from: /reviews, to: /why-jvto/reviews }
  - { from: /all-inclusive, to: /policy/inclusions-exclusions }
  - { from: /student-package, to: /isic/student-package }
  - { from: /how-to-book, to: /travel-guide/booking-information }
  - { from: /terms-and-condition, to: /policy }
