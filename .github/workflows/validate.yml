name: Validate CMS Bootstrap

on:
  pull_request:
  push:
    branches: [main]

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm run validate
      - run: npm test
      - run: npm run build
      # Re-consolidate + re-render over the committed release bundles and fail if
      # the committed projection/HTML is stale (deterministic output drift guard).
      - run: npm run verify:projection
